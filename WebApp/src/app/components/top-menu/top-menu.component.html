<!--
  Top Menu Bar Component. Includes:
  - Button to go to Home Component
  - Scrollable nav links (Leagues, Matches, Players, Teams)
  - User dropdown with Profile, Locations, and Admin options
-->
<nav class="top-menu">
    <div class="top-menu-container">
        <div class="nav-section">
            <a class="nav-link nav-link--home" routerLink="/app/home" routerLinkActive="active">
                <img src="https://server.megamedia.megagera.com/megagera/MG.png" 
                     alt="Home" 
                     class="nav-logo"
                     title="Home">
            </a>

            <div
              class="nav-links-scroll"
              [class.nav-links-scroll--fade-left]="navFadeLeft"
              [class.nav-links-scroll--fade-right]="navFadeRight">
              <div
                class="nav-links-track"
                #navLinksTrack
                (scroll)="onNavLinksScroll()">
                <a class="nav-link nav-link--page" routerLink="/app/leagues" routerLinkActive="active" ariaCurrentWhenActive="page">
                    <span class="nav-text">Leagues</span>
                </a>
                <a class="nav-link nav-link--page" routerLink="/app/matches" routerLinkActive="active" ariaCurrentWhenActive="page">
                    <span class="nav-text">Matches</span>
                </a>
                <a class="nav-link nav-link--page" routerLink="/app/players" routerLinkActive="active" ariaCurrentWhenActive="page">
                    <span class="nav-text">Players</span>
                </a>
                <a class="nav-link nav-link--page" routerLink="/app/teams" routerLinkActive="active" ariaCurrentWhenActive="page">
                    <span class="nav-text">Teams</span>
                </a>
              </div>
            </div>
        </div>
        
        <div class="right-section">
            
            <!-- User dropdown -->
            <div class="user-dropdown">
                <button class="user-button" (click)="toggleUserMenu()" [class.active]="isUserMenuOpen" aria-label="Account menu" [attr.aria-expanded]="isUserMenuOpen">
                    <svg class="user-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 12c4.42 0 8 2.24 8 5v1H4v-1c0-2.76 3.58-5 8-5Z" />
                    </svg>
                </button>
                
                <div class="user-panel" [class.open]="isUserMenuOpen">
                    @if (username) {
                        <p class="user-panel-username">{{ username }}</p>
                    }
                    <a class="user-panel-link" routerLink="/app/profile" routerLinkActive="active" (click)="isUserMenuOpen = false">
                        <ng-icon name="jamUser" class="user-panel-icon" size="18"></ng-icon>
                        <span class="user-panel-text">Profile</span>
                    </a>
                    <a class="user-panel-link" routerLink="/app/feedback" routerLinkActive="active" (click)="isUserMenuOpen = false">
                        <ng-icon name="jamMessage" class="user-panel-icon" size="18"></ng-icon>
                        <span class="user-panel-text">Feedback</span>
                    </a>
                    <a class="user-panel-link" routerLink="/app/locations" routerLinkActive="active" (click)="isUserMenuOpen = false">
                        <ng-icon name="ionLocation" class="user-panel-icon" size="18"></ng-icon>
                        <span class="user-panel-text">Locations</span>
                    </a>
                    @if (isAdmin) {
                        <a class="user-panel-link" routerLink="/app/admin" routerLinkActive="active" (click)="isUserMenuOpen = false">
                            <ng-icon name="jamSettingsAlt" class="user-panel-icon" size="18"></ng-icon>
                            <span class="user-panel-text">Admin</span>
                        </a>
                    }
                    <button class="user-panel-link user-panel-button user-panel-signout" (click)="logout()">
                        <ng-icon name="jamLogOut" class="user-panel-icon" size="18"></ng-icon>
                        <span class="user-panel-text">Sign Out</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>
